[workspace]
resolver = "2"
members = [
    "crates/archive-plugin-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neverjoskiy/RustixZip"
authors = ["RustixZip Contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[workspace.dependencies]
zeroize = { version = "1.8", features = ["derive"] }
