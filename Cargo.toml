[workspace]
resolver = "2"
members = [
    "crates/archive-plugin-api",
    "crates/archive-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neverjoskiy/RustixZip"
authors = ["RustixZip Contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[workspace.dependencies]
archive-plugin-api = { path = "crates/archive-plugin-api" }
blake3 = { version = "1.5", features = ["rayon"] }
bzip2 = { version = "0.5", features = ["static"] }
crc = "3.2"
crc32fast = "1.4"
crossbeam-channel = "0.5"
filetime = "0.2"
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
libloading = "0.8"
lz4_flex = { version = "0.11", features = ["frame"] }
memmap2 = "0.9"
notify = "7.0"
parking_lot = "0.12"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
sevenz-rust2 = { version = "0.13", features = ["aes256", "compress", "util"] }
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tar = "0.4"
tempfile = "3.14"
thiserror = "2.0"
walkdir = "2.5"
xz2 = { version = "0.1", features = ["static"] }
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "2.2", default-features = false, features = ["aes-crypto", "deflate", "deflate64", "bzip2", "zstd", "lzma", "xz"] }
zstd = { version = "0.13", features = ["zstdmt"] }
