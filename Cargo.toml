[workspace]
resolver = "2"
members = [
    "crates/archive-plugin-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/neverjoskiy/RustixZip"
authors = ["RustixZip Contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[workspace.dependencies]
archive-plugin-api = { path = "crates/archive-plugin-api" }

# Concurrency, Memory & Sync
rayon = "1.10"
crossbeam-channel = "0.5"
parking_lot = "0.12"
memmap2 = "0.9"
bytes = "1.7"

# Pure-Rust Core Formats
sevenz-rust2 = { version = "0.13", features = ["aes256", "compress", "util"] }
zip = { version = "2.2", default-features = false, features = ["aes-crypto", "deflate", "zstd", "bzip2", "lzma", "time"] }
tar = "0.4"
flate2 = "1.0"
zstd = { version = "0.13", features = ["zstdmt"] }
xz2 = "0.1"
lz4_flex = { version = "0.11", features = ["frame"] }
bzip2 = "0.5"

# Specialized Pure-Rust Container Parsers
cab = "0.6"
cfb = "0.10"
msi = "0.8"
cpio = "0.4"
rpm = "0.16"
plist = "1.7"

# Cryptography & Checksums
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
hmac = "0.12"
pbkdf2 = "0.12"
sha2 = "0.10"
blake3 = { version = "1.5", features = ["rayon"] }
crc32fast = "1.4"
crc = "3.2"
zeroize = { version = "1.8", features = ["derive"] }
getrandom = "0.2"

# Dynamic Loading, Filesystem & Watcher
libloading = "0.8"
walkdir = "2.5"
notify = "7.0"
tempfile = "3.14"
filetime = "0.2"
sysinfo = "0.32"

# CLI, Serialization & Error Handling
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.11", features = ["v4"] }

# GUI
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["all_loaders"] }
rfd = "0.15"
raw-window-handle = "0.6"
open = "5.3"
